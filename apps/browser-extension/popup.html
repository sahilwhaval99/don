<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>DON Extension</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 14px;
      background: #0a0c10;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #232a38;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 4px;
      margin-left: auto;
    }
    .badge.disconnected {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.3);
    }
    .info {
      color: #94a3b8;
      font-size: 11px;
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      background: #f59e0b;
      color: #000;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
    .btn.secondary {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>
  <div class="header">
    <strong>DON Edge Bridge</strong>
    <span class="badge" id="relay-status">Checking...</span>
  </div>
  <div class="info">
    Microsoft Edge companion for tab orchestration, media control, and sanctioned WhatsApp Web bridge.
  </div>
  <div class="actions">
    <button class="btn" id="open-dashboard">Open HUD Dashboard</button>
    <button class="btn secondary" id="reconnect-relay">Reconnect Relay</button>
  </div>
  <script type="module" src="dist/popup.js"></script>
</body>
</html>
