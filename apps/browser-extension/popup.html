<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>DON Extension</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 14px;
      background: #0a0c10;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #232a38;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 4px;
      margin-left: auto;
    }
    .info {
      color: #94a3b8;
      font-size: 11px;
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .btn {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      background: #f59e0b;
      color: #000;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <strong>DON Navigator</strong>
    <span class="badge" id="relay-status">Relay Paired</span>
  </div>
  <div class="info">
    Minimal-permission browser agent. Safe actions require per-domain user consent.
  </div>
  <button class="btn" id="open-dashboard">Open Dashboard</button>
  <script type="module" src="dist/popup.js"></script>
</body>
</html>
